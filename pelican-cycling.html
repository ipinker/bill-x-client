<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鹈鹕骑自行车</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(to bottom, #87ceeb 0%, #e0f6ff 100%);
        overflow: hidden;
      }

      #scene {
        position: relative;
        width: 100%;
        height: 100vh;
      }

      .ground {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 150px;
        background: #90ee90;
      }

      .road {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 80px;
        background: #808080;
      }

      .road-line {
        position: absolute;
        bottom: 40px;
        width: 100%;
        height: 4px;
        background: repeating-linear-gradient(to right, white 0px, white 40px, transparent 40px, transparent 80px);
        animation: roadMove 1s linear infinite;
      }

      @keyframes roadMove {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-80px);
        }
      }

      #bicycle-pelican {
        position: absolute;
        left: 50%;
        bottom: 150px;
        transform: translateX(-50%);
      }

      @keyframes wheelRotate {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .wheel {
        animation: wheelRotate 1s linear infinite;
        transform-origin: center;
      }

      @keyframes legPedal {
        0% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(180deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .leg {
        animation: legPedal 1s linear infinite;
        transform-origin: 250px 200px;
      }

      @keyframes wingFlap {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-15deg);
        }
      }

      .wing {
        animation: wingFlap 0.5s ease-in-out infinite;
        transform-origin: 240px 180px;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div class="ground"></div>
      <div class="road"></div>
      <div class="road-line"></div>

      <svg id="bicycle-pelican" width="500" height="400" viewBox="0 0 500 400">
        <g id="bicycle">
          <circle class="wheel" cx="150" cy="300" r="40" fill="none" stroke="#333" stroke-width="4" />
          <line class="wheel" x1="150" y1="300" x2="150" y2="260" stroke="#333" stroke-width="2" />
          <line class="wheel" x1="150" y1="300" x2="190" y2="300" stroke="#333" stroke-width="2" />
          <line class="wheel" x1="150" y1="300" x2="110" y2="300" stroke="#333" stroke-width="2" />
          <line class="wheel" x1="150" y1="300" x2="170" y2="280" stroke="#333" stroke-width="2" />
          <line class="wheel" x1="150" y1="300" x2="130" y2="280" stroke="#333" stroke-width="2" />

          <circle class="wheel" cx="350" cy="300" r="40" fill="none" stroke="#333" stroke-width="4" />
          <line class="wheel" x1="350" y1="300" x2="350" y2="260" stroke="#333" stroke-width="2" />
          <line class="wheel" x1="350" y1="300" x2="390" y2="300" stroke="#333" stroke-width="2" />
          <line class="wheel" x1="350" y1="300" x2="310" y2="300" stroke="#333" stroke-width="2" />
          <line class="wheel" x1="350" y1="300" x2="370" y2="280" stroke="#333" stroke-width="2" />
          <line class="wheel" x1="350" y1="300" x2="330" y2="280" stroke="#333" stroke-width="2" />

          <line x1="150" y1="300" x2="250" y2="240" stroke="#ff6b6b" stroke-width="6" />
          <line x1="250" y1="240" x2="350" y2="300" stroke="#ff6b6b" stroke-width="6" />
          <line x1="250" y1="240" x2="250" y2="180" stroke="#ff6b6b" stroke-width="6" />
          <line x1="250" y1="180" x2="280" y2="200" stroke="#ff6b6b" stroke-width="6" />
          <line x1="250" y1="240" x2="250" y2="280" stroke="#ff6b6b" stroke-width="6" />

          <circle cx="250" cy="280" r="20" fill="none" stroke="#333" stroke-width="3" />
          <line x1="230" y1="280" x2="270" y2="280" stroke="#333" stroke-width="3" />
          <line x1="250" y1="260" x2="250" y2="300" stroke="#333" stroke-width="3" />
        </g>

        <g id="pelican">
          <ellipse cx="250" cy="200" rx="50" ry="60" fill="#f0f0f0" stroke="#333" stroke-width="2" />

          <circle cx="250" cy="160" r="35" fill="#f0f0f0" stroke="#333" stroke-width="2" />

          <circle cx="240" cy="150" r="6" fill="#000" />
          <circle cx="260" cy="150" r="6" fill="#000" />

          d="M 250 160 Q 280 165 290 155 L 320 160 Q 315 175 290 175 Q 270 175 250 170 Z" fill="#ffa500" stroke="#333"
          stroke-width="2" d="M 250 175 Q 280 180 290 180 L 290 190 Q 270 190 250 185 Z" fill="#ff8c00" stroke="#333"
          stroke-width="2"

          <g class="wing">
            <ellipse cx="220" cy="190" rx="35" ry="55" fill="#e0e0e0" stroke="#333" stroke-width="2" />
          </g>

          <g class="leg" style="animation-delay: 0s">
            <line x1="250" y1="260" x2="240" y2="280" stroke="#ffa500" stroke-width="4" />
            <line x1="240" y1="280" x2="250" y2="290" stroke="#ffa500" stroke-width="4" />
            <path d="M 250 290 L 245 292 L 240 290 L 238 292" fill="none" stroke="#ffa500" stroke-width="3" />
          </g>

          <g class="leg" style="animation-delay: 0.5s">
            <line x1="250" y1="260" x2="260" y2="280" stroke="#ffa500" stroke-width="4" />
            <line x1="260" y1="280" x2="250" y2="290" stroke="#ffa500" stroke-width="4" />
            <path d="M 250 290 L 255 292 L 260 290 L 262 292" fill="none" stroke="#ffa500" stroke-width="3" />
          </g>
        </g>
      </svg>
    </div>
  </body>
</html>
